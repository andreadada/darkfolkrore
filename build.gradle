plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'darkfolklore-core'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('src/generated/**/.cache')
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = uri('https://api.modrinth.com/maven')
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            // The tests are ours; the tiny structure template is vanilla's stable empty bastion template.
            systemProperty 'neoforge.enabledGameTestNamespaces', "${project.mod_id},minecraft"
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output',
                    file('src/generated/resources/').absolutePath, '--existing',
                    file('src/main/resources/').absolutePath
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

configurations {
    auditedCompat {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    compileOnly.extendsFrom auditedCompat
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Immutable Modrinth version IDs resolve the exact JARs audited by the compatibility layer.
    // They are compile-only: no third-party mod or development tool is shaded into the release.
    auditedCompat 'maven.modrinth:jVZ0F1wn:rAtxPNwi' // Vampirism 1.21-1.10.12
    auditedCompat 'maven.modrinth:3ElBohKg:zkd687ts' // Werewolves 1.21-2.0.3.3
    auditedCompat 'maven.modrinth:field-guide:8jdVbcd0' // Field Guide 1.14.0 NeoForge
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            java_version_range     : java_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_authors            : mod_authors,
            mod_version            : mod_version,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'darkfolklore.resourcesDir', file('src/main/resources').absolutePath
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

def auditedCompatHashes = [
        'jVZ0F1wn-rAtxPNwi.jar'  : 'C6DCCA1AF24DECA473A24470CCAB66053D3AA3324E453B4E1697090ED6D16BE2',
        '3ElBohKg-zkd687ts.jar'   : 'ECBCA2CD344E24AD48157834A8F321D1A7D2221C727FE8E61E4436D1219C6CFB',
        'field-guide-8jdVbcd0.jar': '00B26B1351CB85B90ED86675C49BFC054A3141BEDAE22358D5A6AD4FE7CB0740'
]

def verifyAuditedCompat = tasks.register('verifyAuditedCompat') {
    group = 'verification'
    description = 'Verifies immutable compile-only compatibility JARs against the audited SHA-256 hashes.'
    inputs.files(configurations.auditedCompat)
    inputs.property('expectedHashes', auditedCompatHashes)
    doLast {
        Map<String, File> artifacts = inputs.files.files.collectEntries { [(it.name): it] }
        Map<String, String> expectedHashes = inputs.properties.expectedHashes
        expectedHashes.each { name, expected ->
            File artifact = artifacts[name]
            if (artifact == null) {
                throw new GradleException("Audited compatibility artifact did not resolve: ${name}")
            }
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            artifact.withInputStream { stream ->
                byte[] buffer = new byte[8192]
                for (int read = stream.read(buffer); read >= 0; read = stream.read(buffer)) {
                    if (read > 0) digest.update(buffer, 0, read)
                }
            }
            String actual = digest.digest().encodeHex().toString().toUpperCase(Locale.ROOT)
            if (actual != expected) {
                throw new GradleException("Checksum mismatch for ${name}: expected ${expected}, got ${actual}")
            }
        }
    }
}

tasks.named('compileJava') {
    dependsOn verifyAuditedCompat
}

jar {
    from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE_darkfolklore' }
    }
    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def auditReleaseJar = tasks.register('auditReleaseJar') {
    group = 'verification'
    description = 'Checks the production JAR for required metadata/resources and forbidden bundled content.'
    dependsOn tasks.named('jar')
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })
    inputs.property('expectedVersion', project.version.toString())

    doLast {
        File artifact = inputs.files.singleFile
        String expectedVersion = inputs.properties.expectedVersion
        def zip = new java.util.zip.ZipFile(artifact)
        try {
            Set<String> names = zip.entries().collect { it.name } as Set
            [
                    'META-INF/MANIFEST.MF',
                    'META-INF/LICENSE_darkfolklore',
                    'META-INF/neoforge.mods.toml',
                    'assets/darkfolklore/lang/en_us.json',
                    'assets/darkfolklore/lang/it_it.json',
                    'data/darkfolklore/darkfolklore/canonical/vampire.json'
            ].each { required ->
                if (!names.contains(required)) {
                    throw new GradleException("Release JAR is missing required entry: ${required}")
                }
            }
            if (!names.any { it.startsWith('data/darkfolklore/fieldguide/') }) {
                throw new GradleException('Release JAR contains no Dark Folklore Field Guide resources')
            }

            List<String> forbidden = names.findAll { name ->
                String lower = name.toLowerCase(Locale.ROOT)
                lower.startsWith('com/darkfolklore/atlas/') ||
                        lower.startsWith('org/junit/') ||
                        lower.startsWith('org/opentest4j/') ||
                        lower.startsWith('org/apiguardian/') ||
                        lower.startsWith('de/teamlapen/') ||
                        lower.startsWith('com/evandev/fieldguide/') ||
                        lower.startsWith('net/conczin/mca/') ||
                        lower.startsWith('com/guilh/mca_vampirism_compat/') ||
                        lower.endsWith('test.class') ||
                        lower.endsWith('.jar') ||
                        lower.endsWith('.tmp') || lower.endsWith('.bak') || lower.endsWith('.orig') ||
                        lower.endsWith('.pyc') || lower.contains('/__pycache__/') ||
                        lower.contains('/.cache/') || lower.contains('/.idea/') ||
                        lower.endsWith('/.ds_store') || lower.endsWith('/thumbs.db')
            }
            if (!forbidden.isEmpty()) {
                throw new GradleException("Release JAR contains forbidden development/test/shaded entries: ${forbidden}")
            }

            zip.entries().findAll { !it.directory }.each { entry ->
                byte[] bytes = zip.getInputStream(entry).withCloseable { it.readAllBytes() }
                if (entry.name.endsWith('.class')) {
                    if (bytes.length < 8 || bytes[0] != (byte) 0xCA || bytes[1] != (byte) 0xFE ||
                            bytes[2] != (byte) 0xBA || bytes[3] != (byte) 0xBE) {
                        throw new GradleException("Invalid class file in release JAR: ${entry.name}")
                    }
                    int major = ((bytes[6] & 0xff) << 8) | (bytes[7] & 0xff)
                    if (major != 65) {
                        throw new GradleException("${entry.name} uses class version ${major}; expected Java 21 / 65")
                    }
                }
                if (bytes.length <= 5_000_000) {
                    String content = new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                    if (content =~ /(?i)[A-Z]:[\\\\\/]+Users[\\\\\/]+/) {
                        throw new GradleException("Release JAR leaks a local absolute user path in ${entry.name}")
                    }
                }
            }

            String metadata = zip.getInputStream(zip.getEntry('META-INF/neoforge.mods.toml'))
                    .withCloseable { new String(it.readAllBytes(), java.nio.charset.StandardCharsets.UTF_8) }
            if (metadata.contains('${') || !metadata.contains("version=\"${expectedVersion}\"")) {
                throw new GradleException('Generated NeoForge metadata contains placeholders or the wrong version')
            }
            names.findAll { !it.contains('/') && it.endsWith('.mixins.json') }.each { mixinConfig ->
                if (!metadata.contains("config=\"${mixinConfig}\"") &&
                        !metadata.contains("config = \"${mixinConfig}\"")) {
                    throw new GradleException("Mixin config is packaged but not declared in metadata: ${mixinConfig}")
                }
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named('check') {
    dependsOn auditReleaseJar
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
