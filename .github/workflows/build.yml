name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build, test, validate resources, and audit release JAR
        run: ./gradlew clean build --no-daemon --no-configuration-cache --stacktrace

      - name: Run NeoForge GameTests
        run: ./gradlew runGameTestServer --no-daemon --no-configuration-cache --stacktrace

      - name: Record production JAR identity
        shell: bash
        run: |
          JAR=build/libs/darkfolklore-core-0.3.1.jar
          test -f "$JAR"
          echo "JAR=$JAR"
          echo "SIZE_BYTES=$(stat -c '%s' "$JAR")"
          echo "SHA256=$(sha256sum "$JAR" | awk '{print toupper($1)}')"
          echo "CLASS_COUNT=$(jar tf "$JAR" | grep -c '\.class$')"

      - name: Upload production JAR
        uses: actions/upload-artifact@v4
        with:
          name: darkfolklore-core-0.3.1
          path: build/libs/darkfolklore-core-0.3.1.jar
          if-no-files-found: error
          retention-days: 14
